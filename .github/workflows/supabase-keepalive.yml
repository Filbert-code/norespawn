name: Supabase keep-alive

# Supabase pauses free-tier projects after 7 days of inactivity.
# This workflow pings the project a couple of times a week to keep it awake.
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       e.g. https://abcdefghijklmnop.supabase.co
#   SUPABASE_ANON_KEY  the public anon key (never the service_role key)

on:
  schedule:
    # 09:00 UTC every Tuesday and Saturday
    - cron: "0 9 * * 2,6"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health endpoint
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Unexpected status code; project may be paused or misconfigured."
            exit 1
          fi
