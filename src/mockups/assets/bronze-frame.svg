<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <!--
    9-slice bronze war-plaque frame. Designed so a 30px corner slice keeps the
    beveled corners + rivets crisp while the straight edge strips stretch.
    Bevel cuts the top-left and bottom-right corners to match the app's
    `clip-bevel` silhouette. Center is transparent (the button paints its own).
  -->
  <path d="M18 4 H92 V74 L74 92 H4 V18 Z"
        stroke="#b08d57" stroke-width="2" stroke-linejoin="round" />
  <path d="M21 9 H87 V71 L71 87 H9 V21 Z"
        stroke="#b08d57" stroke-width="1" stroke-opacity="0.45" stroke-linejoin="round" />
  <circle cx="87" cy="9" r="1.8" fill="#b08d57" />
  <circle cx="9" cy="87" r="1.8" fill="#b08d57" />
  <circle cx="17" cy="6" r="1.4" fill="#b08d57" fill-opacity="0.8" />
  <circle cx="79" cy="90" r="1.4" fill="#b08d57" fill-opacity="0.8" />
</svg>
